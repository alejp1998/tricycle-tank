<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Light background -->
  <rect width="900" height="560" rx="16" fill="#FFFFFF"/>
  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Tricycle Tank — FSM Architecture</text>
  <text x="450" y="66" text-anchor="middle" font-size="13" fill="#64748B">four finite-state machines · shared 10 ms clock (CLK_MS) · wiringPi GPIO + interrupts</text>

  <!-- Main loop box -->
  <rect x="330" y="92" width="240" height="52" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
  <text x="450" y="117" text-anchor="middle" font-size="15" font-weight="600" fill="#4338CA">main loop · every CLK_MS (10 ms)</text>
  <text x="450" y="134" text-anchor="middle" font-size="11" fill="#6366F1">fsm_fire() x4 · delay_until(next)</text>

  <!-- Connectors down -->
  <line x1="400" y1="144" x2="400" y2="172" stroke="#94A3B8" stroke-width="2"/>
  <line x1="450" y1="144" x2="450" y2="172" stroke="#94A3B8" stroke-width="2"/>
  <line x1="500" y1="144" x2="500" y2="172" stroke="#94A3B8" stroke-width="2"/>

  <!-- FSM boxes row 1 -->
  <rect x="230" y="174" width="160" height="54" rx="10" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="310" y="198" text-anchor="middle" font-size="14" font-weight="600" fill="#15803D">xbox360 FSM</text>
  <text x="310" y="216" text-anchor="middle" font-size="11" fill="#16A34A">controller input · debounce</text>

  <rect x="420" y="174" width="160" height="54" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="500" y="198" text-anchor="middle" font-size="14" font-weight="600" fill="#B91C1C">player FSM</text>
  <text x="500" y="216" text-anchor="middle" font-size="11" fill="#DC2626">softTone melodies</text>

  <rect x="610" y="174" width="160" height="54" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <text x="690" y="198" text-anchor="middle" font-size="14" font-weight="600" fill="#C2410C">ruedas FSM</text>
  <text x="690" y="216" text-anchor="middle" font-size="11" fill="#EA580C">PWM wheels · steering</text>

  <!-- Arrows down from row 1 -->
  <line x1="310" y1="228" x2="310" y2="258" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="228" x2="500" y2="258" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="228" x2="690" y2="258" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- torreta FSM -->
  <rect x="350" y="260" width="300" height="54" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="500" y="284" text-anchor="middle" font-size="14" font-weight="600" fill="#6D28D9">torreta FSM</text>
  <text x="500" y="302" text-anchor="middle" font-size="11" fill="#7C3AED">turret servos · IR laser · shoot timeout</text>

  <!-- to GPIO -->
  <line x1="500" y1="314" x2="500" y2="344" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="310" y1="228" x2="310" y2="314" stroke="#94A3B8" stroke-width="2"/>
  <line x1="690" y1="228" x2="690" y2="314" stroke="#94A3B8" stroke-width="2"/>

  <!-- GPIO layer -->
  <rect x="230" y="346" width="540" height="64" rx="10" fill="#F8FAFC" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="500" y="372" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">wiringPi GPIO layer</text>
  <text x="500" y="391" text-anchor="middle" font-size="11" fill="#64748B">pin 18/19 PWM wheels · 17/27 softPWM servos · 23 softTone · 9 laser · 11 hit ISR</text>

  <!-- Interrupt side -->
  <rect x="640" y="92" width="180" height="52" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <text x="730" y="113" text-anchor="middle" font-size="13" font-weight="600" fill="#C2410C">hit detection</text>
  <text x="730" y="130" text-anchor="middle" font-size="11" fill="#EA580C">wiringPiISR · pin 11 rising edge</text>
  <line x1="730" y1="144" x2="660" y2="346" stroke="#F97316" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowO)"/>
  <text x="742" y="250" font-size="11" fill="#EA580C" transform="rotate(76 742 250)">flags_juego / flags_player</text>

  <!-- player input side -->
  <rect x="80" y="92" width="180" height="52" rx="10" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="170" y="113" text-anchor="middle" font-size="13" font-weight="600" fill="#15803D">xbox360.txt</text>
  <text x="170" y="130" text-anchor="middle" font-size="11" fill="#16A34A">key · turret · posX · posY (python bridge)</text>
  <line x1="170" y1="144" x2="270" y2="198" stroke="#22C55E" stroke-width="2" marker-end="url(#arrowG)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22C55E"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F97316"/>
    </marker>
  </defs>
</svg>
