<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Light background -->
  <rect width="900" height="500" rx="16" fill="#FFFFFF"/>
  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Tricycle Tank — FSM Architecture</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#64748B">four finite-state machines · shared 10 ms clock (CLK_MS) · wiringPi GPIO + interrupts</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F97316"/>
    </marker>
  </defs>

  <!-- ============ TOP: main loop ============ -->
  <rect x="330" y="78" width="240" height="52" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
  <text x="450" y="103" text-anchor="middle" font-size="15" font-weight="600" fill="#4338CA">main loop · every CLK_MS (10 ms)</text>
  <text x="450" y="120" text-anchor="middle" font-size="11" fill="#6366F1">fsm_fire() x4 · delay_until(next)</text>

  <!-- fan-out bus + arrows to each FSM (tips land on the box tops at y=168) -->
  <line x1="450" y1="130" x2="450" y2="146" stroke="#94A3B8" stroke-width="2"/>
  <line x1="165" y1="146" x2="735" y2="146" stroke="#94A3B8" stroke-width="2"/>
  <line x1="165" y1="146" x2="165" y2="164" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="355" y1="146" x2="355" y2="164" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="545" y1="146" x2="545" y2="164" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="735" y1="146" x2="735" y2="164" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ FSM ROW ============ -->
  <rect x="85" y="168" width="160" height="54" rx="10" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="165" y="193" text-anchor="middle" font-size="14" font-weight="600" fill="#15803D">xbox360 FSM</text>
  <text x="165" y="210" text-anchor="middle" font-size="10.5" fill="#16A34A">controller input · debounce</text>

  <rect x="275" y="168" width="160" height="54" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="355" y="193" text-anchor="middle" font-size="14" font-weight="600" fill="#B91C1C">player FSM</text>
  <text x="355" y="210" text-anchor="middle" font-size="10.5" fill="#DC2626">softTone melodies</text>

  <rect x="465" y="168" width="160" height="54" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <text x="545" y="193" text-anchor="middle" font-size="14" font-weight="600" fill="#C2410C">ruedas FSM</text>
  <text x="545" y="210" text-anchor="middle" font-size="10.5" fill="#EA580C">PWM wheels · steering</text>

  <rect x="655" y="168" width="160" height="54" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="735" y="193" text-anchor="middle" font-size="14" font-weight="600" fill="#6D28D9">torreta FSM</text>
  <text x="735" y="207" text-anchor="middle" font-size="10.5" fill="#7C3AED">servos · laser</text>
  <text x="735" y="219" text-anchor="middle" font-size="10.5" fill="#7C3AED">shoot timeout</text>

  <!-- FSM -> GPIO arrows (tips land on the GPIO top at y=330) -->
  <line x1="165" y1="222" x2="165" y2="326" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="355" y1="222" x2="355" y2="326" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="545" y1="222" x2="545" y2="326" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="735" y1="222" x2="735" y2="326" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ GPIO LAYER ============ -->
  <rect x="60" y="330" width="780" height="64" rx="10" fill="#F8FAFC" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="450" y="356" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">wiringPi GPIO layer</text>
  <text x="450" y="376" text-anchor="middle" font-size="11.5" fill="#64748B">pin 18/19 PWM wheels · 17/27 softPWM servos · 23 softTone · 9 laser · 11 hit ISR</text>

  <!-- ============ HIT DETECTION (input side) ============ -->
  <line x1="740" y1="414" x2="740" y2="398" stroke="#F97316" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowO)"/>
  <text x="628" y="445" text-anchor="end" font-size="11" fill="#EA580C">flags_juego / flags_player</text>
  <rect x="640" y="414" width="200" height="52" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <text x="740" y="436" text-anchor="middle" font-size="13" font-weight="600" fill="#C2410C">hit detection</text>
  <text x="740" y="453" text-anchor="middle" font-size="11" fill="#EA580C">wiringPiISR · pin 11 rising edge</text>
</svg>
